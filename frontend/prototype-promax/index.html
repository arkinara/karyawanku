<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>KaryawanKu ProMax — Prototype Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/kk.css" />
<script>(function(){var q=new URLSearchParams(location.search).get('theme');var m=q;if(!m){try{m=localStorage.getItem('kk-theme')}catch(e){}}if(!m)m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(m==='dark')document.documentElement.classList.add('dark')})();</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/kk-tailwind.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  .viewer { display: flex; flex-direction: column; height: 100dvh; }
  .stage {
    flex: 1;
    display: flex;
    gap: 12px;
    justify-content: center;
    padding: 14px;
    overflow: auto;
    background:
      radial-gradient(circle at 1px 1px, hsl(var(--outline) / .28) 1px, transparent 0) 0 0 / 18px 18px,
      hsl(var(--surface-2));
  }
  .device {
    display: flex;
    flex-direction: column;
    min-width: 0;
    border: 1px solid hsl(var(--outline-variant));
    border-radius: var(--r-lg);
    background: hsl(var(--surface));
    box-shadow: var(--e3);
    overflow: hidden;
    transition: width var(--d-slow) var(--ease-emphasized);
  }
  .device-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-bottom: 1px solid hsl(var(--outline-variant));
    background: hsl(var(--surface-1));
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: hsl(var(--on-surface-variant));
  }
  .device iframe { flex: 1; width: 100%; border: 0; display: block; background: hsl(var(--surface)); }
  .tabbar { display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    flex: none;
    min-height: 36px;
    padding: 0 13px;
    border: 1px solid hsl(var(--outline-variant));
    border-radius: var(--r-full);
    background: hsl(var(--surface));
    color: hsl(var(--on-surface-variant));
    font: inherit; font-size: 13px; font-weight: 560;
    cursor: pointer; white-space: nowrap;
    transition: background-color var(--d-fast), color var(--d-fast), border-color var(--d-fast);
  }
  .tab:hover { background: hsl(var(--surface-2)); color: hsl(var(--on-surface)); }
  .tab[aria-selected="true"] { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--on-primary)); font-weight: 650; }
  .tab .n { font-variant-numeric: tabular-nums; opacity: .7; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 8px 12px;
    border-top: 1px solid hsl(var(--outline-variant));
    border-bottom: 1px solid hsl(var(--outline-variant));
    background: hsl(var(--surface-1));
  }
  kbd {
    display: inline-block;
    min-width: 18px;
    padding: 1px 5px;
    border: 1px solid hsl(var(--outline-variant));
    border-bottom-width: 2px;
    border-radius: 5px;
    background: hsl(var(--surface));
    font-family: inherit; font-size: 11px; font-weight: 650;
    text-align: center;
  }
  .notes {
    flex: none;
    max-height: 34vh;
    overflow-y: auto;
    padding: 14px 16px;
    border-top: 1px solid hsl(var(--outline-variant));
    background: hsl(var(--surface));
  }
  .notes[hidden] { display: none; }
  .notes ul { margin: 8px 0 0; padding-left: 18px; }
  .notes li { margin-bottom: 4px; font-size: 13.5px; }
</style>
</head>
<body>

<div class="viewer">

  <!-- Header -->
  <header class="appbar" style="position:static;padding-left:14px">
    <span class="brand-mark" aria-hidden="true">K</span>
    <div class="min-w-0 flex-1">
      <p class="t-h3">KaryawanKu <span style="color:hsl(var(--primary))">ProMax</span></p>
      <p class="t-caption truncate">7 halaman · design tokens bersama · light/dark · Bahasa Indonesia</p>
    </div>
    <button type="button" class="btn btn-icon" data-kk-theme-toggle></button>
    <a class="btn btn-outline btn-sm" id="openTab" href="03-quick-dashboard-owner.html" target="_blank" rel="noopener">
      <span data-icon="play"></span> Buka tab baru
    </a>
  </header>

  <!-- Page tabs -->
  <nav class="tabbar" id="tabs" role="tablist" aria-label="Halaman prototype"></nav>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="segmented" role="group" aria-label="Ukuran layar">
      <button class="seg" data-vp="375" aria-selected="false">375</button>
      <button class="seg" data-vp="768" aria-selected="false">768</button>
      <button class="seg" data-vp="1024" aria-selected="false">1024</button>
      <button class="seg" data-vp="1440" aria-selected="true">1440</button>
      <button class="seg" data-vp="full" aria-selected="false">Penuh</button>
    </div>

    <button type="button" class="btn btn-outline btn-sm" id="cmpToggle" aria-pressed="false">
      <span data-icon="filter"></span> Bandingkan v1
    </button>

    <button type="button" class="btn btn-outline btn-sm" id="notesToggle" aria-pressed="true" aria-controls="notes">
      <span data-icon="info"></span> Catatan perubahan
    </button>

    <span class="t-caption ml-auto hidden items-center gap-1 sm:flex">
      <kbd>1</kbd>–<kbd>7</kbd> halaman · <kbd>[</kbd><kbd>]</kbd> ukuran · <kbd>c</kbd> banding · <kbd>t</kbd> tema
    </span>
  </div>

  <!-- Stage -->
  <div class="stage" id="stage">
    <div class="device" id="devNew" style="width:1440px;max-width:100%">
      <div class="device-bar">
        <span style="color:hsl(var(--primary))">ProMax</span>
        <span id="labNew" style="font-weight:500;text-transform:none;letter-spacing:0"></span>
        <span class="ml-auto num" id="wNew">1440px</span>
      </div>
      <iframe id="frameNew" title="Prototype ProMax" src="03-quick-dashboard-owner.html"></iframe>
    </div>

    <div class="device" id="devOld" hidden style="width:1440px;max-width:100%">
      <div class="device-bar">
        <span>v1 (asli)</span>
        <span style="font-weight:500;text-transform:none;letter-spacing:0">../prototype</span>
        <span class="ml-auto num" id="wOld">1440px</span>
      </div>
      <iframe id="frameOld" title="Prototype versi 1" src="../prototype/03-quick-dashboard-owner.html"></iframe>
    </div>
  </div>

  <!-- Change notes -->
  <section class="notes" id="notes" aria-live="polite">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 class="t-h3" id="noteTitle">—</h2>
        <p class="t-caption mt-0.5" id="noteMeta">—</p>
      </div>
      <span class="chip chip-primary" id="noteRole">—</span>
    </div>
    <ul id="noteList"></ul>
  </section>
</div>

<script src="assets/kk.js"></script>
<script>
(function () {
  document.querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = KK.icon(el.dataset.icon, 16); });

  var PAGES = [
    {
      id: '01', file: '01-onboarding-wizard.html', title: 'Onboarding wizard', role: 'Pemilik',
      meta: '3 langkah setup usaha + komponen gaji bawaan',
      notes: [
        'Emoji ikon (🍽️ 💼) diganti ikon SVG satu keluarga — emoji tidak bisa di-token dan berbeda tiap platform.',
        'Estimasi take-home pay dihitung langsung dari input, jadi pemilik melihat akibat perubahan angka seketika.',
        'Draf disimpan otomatis ke localStorage; form panjang tidak hilang kalau tab tertutup.',
        'Validasi saat blur (bukan tiap ketikan) dengan pesan error di bawah kolom terkait.',
        'Tunjangan makan pakai progressive disclosure — muncul hanya kalau diaktifkan.',
      ],
    },
    {
      id: '02', file: '02-auth-sign-in.html', title: 'Masuk', role: 'Semua',
      meta: 'Kartu login + panel brand, validasi inline',
      notes: [
        'Validasi email/kata sandi dengan pesan yang menyebut cara memperbaiki, bukan hanya "tidak valid".',
        'Tombol submit punya state loading (aria-busy) sehingga tidak bisa diklik dua kali.',
        'Toggle lihat/sembunyikan sandi memakai aria-pressed dan ikon yang berubah.',
        'Pemilih peran (Pemilik/Karyawan) menentukan halaman tujuan — mempercepat review prototype.',
        'autocomplete + inputmode benar agar keyboard mobile dan password manager bekerja.',
      ],
    },
    {
      id: '03', file: '03-quick-dashboard-owner.html', title: 'Ringkasan pemilik', role: 'Pemilik',
      meta: 'Metrik, tren 14 hari, antrean cuti, status payroll',
      notes: [
        'Grafik tren kehadiran 14 hari (sebelumnya tidak ada data historis) — CSS/HTML murni, tanpa library chart.',
        'Grafik punya padanan tabel di dalam <details> plus ringkasan teks untuk screen reader.',
        'Banner prioritas di atas menyatakan satu hal yang butuh keputusan hari ini.',
        'Setujui/Tolak cuti: Tolak minta konfirmasi (destruktif), keduanya bisa dibatalkan lewat toast Undo.',
        'Badge navigasi, metrik, dan banner ikut turun otomatis saat pengajuan diputuskan.',
        'Timeline payroll menunjukkan posisi proses, bukan hanya angka total.',
      ],
    },
    {
      id: '04', file: '04-quick-dashboard-employee.html', title: 'Beranda karyawan', role: 'Karyawan',
      meta: 'Widget absensi, jadwal, kuota cuti, slip terakhir',
      notes: [
        'Ring jam kerja terisi animatif dan angkanya jalan sendiri (ticker), bukan angka mati.',
        'Clock out minta konfirmasi karena mengunci catatan shift, lalu bisa dibatalkan lewat Undo.',
        'Ditambah ringkasan "Bulan ini" (jam kerja, hadir, telat, lembur) yang sebelumnya tidak terlihat.',
        'Kartu kuota cuti memakai meter + angka, tidak mengandalkan warna saja.',
        'Jadwal diperluas jadi 4 hari termasuk hari libur, agar pola shift terbaca.',
      ],
    },
    {
      id: '05', file: '05-employee-directory.html', title: 'Daftar karyawan', role: 'Pemilik',
      meta: '12 karyawan, cari, filter, urut, pilih massal',
      notes: [
        'Pencarian, filter status, dan pengurutan benar-benar berfungsi (sebelumnya statis).',
        'Header tabel sticky dan sortable dengan aria-sort — arah panah, bukan hanya warna.',
        'Pilih massal + action bar: ekspor terpilih dan nonaktifkan dengan konfirmasi + Undo.',
        'Empty state punya jalan keluar ("Bersihkan pencarian & filter"), bukan halaman kosong.',
        'Detail karyawan memakai <dialog> native, jadi Esc, focus trap, dan inert gratis.',
        'Tabel (desktop) dan kartu (mobile) digenerate dari satu sumber data — tidak bisa berbeda isi.',
      ],
    },
    {
      id: '06', file: '06-payroll-run.html', title: 'Payroll run', role: 'Pemilik',
      meta: '11 karyawan, komposisi biaya, approval',
      notes: [
        'Semua total dihitung dari data baris — subtotal tidak mungkin lagi tidak nyambung.',
        'Angka potongan dibuat realistis (BPJS 3% + PPh 21), bukan 15% dari gaji seperti versi lama.',
        'Baris yang perlu diperiksa ditandai dan bisa difilter sebelum disetujui.',
        'Approve wajib konfirmasi karena tidak bisa dibatalkan; status halaman berubah setelahnya.',
        'Approve bar sticky di bawah, jadi total transfer selalu terlihat sepanjang tabel panjang.',
        'Komposisi biaya (pokok/tunjangan/lembur) sebagai meter + legenda + ringkasan teks.',
      ],
    },
    {
      id: '07', file: '07-payslip-detail.html', title: 'Slip gaji', role: 'Karyawan',
      meta: 'Pendapatan, potongan, riwayat 6 bulan',
      notes: [
        'Pemilih periode dengan 3 slip nyata (Agustus, Juli, Juni termasuk THR) — bukan satu halaman mati.',
        'Setiap baris punya penjelasan cara hitung (misal "4 jam × 1,5 × upah per jam").',
        'Riwayat take-home 6 bulan sebagai grafik + ringkasan teks untuk screen reader.',
        'Angka slip konsisten dengan halaman payroll: pokok 2.400.000, take-home 2.828.000.',
        'Layout cetak khusus (@media print) — slip bisa dicetak tanpa navigasi.',
        '"Laporkan selisih ke HR" memberi jalan pemulihan kalau angka salah.',
      ],
    },
  ];

  var idx = 0;
  var vp = '1440';
  var compare = false;

  var tabs = document.getElementById('tabs');
  var frameNew = document.getElementById('frameNew');
  var frameOld = document.getElementById('frameOld');
  var devOld = document.getElementById('devOld');
  var devNew = document.getElementById('devNew');

  tabs.innerHTML = PAGES.map(function (p, i) {
    return '<button class="tab" role="tab" data-i="' + i + '" aria-selected="' + (i === 0) + '">' +
      '<span class="n">' + p.id + '</span><span>' + p.title + '</span></button>';
  }).join('');

  function theme() { return document.documentElement.classList.contains('dark') ? 'dark' : 'light'; }

  function load(i, pushHash) {
    idx = i;
    var p = PAGES[i];
    frameNew.src = p.file + '?theme=' + theme();
    if (compare) frameOld.src = '../prototype/' + p.file;
    document.getElementById('openTab').href = p.file;
    document.getElementById('labNew').textContent = p.file;
    document.getElementById('noteTitle').textContent = p.id + ' · ' + p.title;
    document.getElementById('noteMeta').textContent = p.meta;
    document.getElementById('noteRole').textContent = p.role;
    document.getElementById('noteList').innerHTML = p.notes.map(function (n) { return '<li>' + n + '</li>'; }).join('');
    tabs.querySelectorAll('.tab').forEach(function (t, j) { t.setAttribute('aria-selected', String(j === i)); });
    if (pushHash !== false) location.hash = p.id;
    KK.announce('Menampilkan halaman ' + p.title);
  }

  tabs.addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (t) load(Number(t.dataset.i));
  });

  /* ---------- viewport ------------------------------------------------- */
  function setVp(v) {
    vp = v;
    document.querySelectorAll('[data-vp]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.dataset.vp === v));
    });
    var w = v === 'full' ? '100%' : v + 'px';
    var label = v === 'full' ? 'penuh' : v + 'px';
    [devNew, devOld].forEach(function (d) { d.style.width = w; });
    document.getElementById('wNew').textContent = label;
    document.getElementById('wOld').textContent = label;
    // Side by side at fixed widths only makes sense if both fit.
    document.getElementById('stage').style.justifyContent = v === 'full' ? 'stretch' : 'center';
  }
  document.querySelectorAll('[data-vp]').forEach(function (b) {
    b.addEventListener('click', function () { setVp(b.dataset.vp); });
  });

  /* ---------- compare -------------------------------------------------- */
  document.getElementById('cmpToggle').addEventListener('click', function () {
    compare = !compare;
    this.setAttribute('aria-pressed', String(compare));
    devOld.hidden = !compare;
    if (compare) {
      frameOld.src = '../prototype/' + PAGES[idx].file;
      if (vp === '1440') setVp('768');   // two 1440 frames never fit — step down
    }
    KK.announce(compare ? 'Mode banding aktif: v1 di kanan' : 'Mode banding nonaktif');
  });

  document.getElementById('notesToggle').addEventListener('click', function () {
    var n = document.getElementById('notes');
    n.hidden = !n.hidden;
    this.setAttribute('aria-pressed', String(!n.hidden));
  });

  /* ---------- keyboard ------------------------------------------------- */
  var VPS = ['375', '768', '1024', '1440', 'full'];
  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea, select')) return;
    if (e.key >= '1' && e.key <= '7') { load(Number(e.key) - 1); return; }
    if (e.key === ']') { setVp(VPS[Math.min(VPS.indexOf(vp) + 1, VPS.length - 1)]); return; }
    if (e.key === '[') { setVp(VPS[Math.max(VPS.indexOf(vp) - 1, 0)]); return; }
    if (e.key === 'c') { document.getElementById('cmpToggle').click(); return; }
    if (e.key === 't') { KK.toggleTheme(); return; }
    if (e.key === 'ArrowRight') { load(Math.min(idx + 1, PAGES.length - 1)); return; }
    if (e.key === 'ArrowLeft') { load(Math.max(idx - 1, 0)); }
  });

  // Theme changes must reach the embedded page too.
  document.addEventListener('kk:theme', function (e) {
    try { frameNew.contentWindow.postMessage({ kkTheme: e.detail.mode }, '*'); } catch (err) { /* ignore */ }
  });

  window.addEventListener('hashchange', function () {
    var i = PAGES.findIndex(function (p) { return p.id === location.hash.replace('#', ''); });
    if (i > -1 && i !== idx) load(i, false);
  });

  var start = PAGES.findIndex(function (p) { return p.id === location.hash.replace('#', ''); });
  setVp('1440');
  load(start > -1 ? start : 2, false);   // default: owner dashboard
})();
</script>
</body>
</html>
