<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Masuk · KaryawanKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: {
        primary: { DEFAULT: 'hsl(175 77% 26%)', hover: 'hsl(175 77% 21%)', press: 'hsl(175 77% 16%)', on: 'hsl(0 0% 100%)', container: 'hsl(175 52% 91%)', oncontainer: 'hsl(175 80% 13%)' },
        surface: { DEFAULT: 'hsl(180 20% 99%)', c1: 'hsl(180 22% 97%)', c2: 'hsl(180 20% 95%)', c3: 'hsl(180 18% 92%)', c4: 'hsl(180 16% 89%)' },
        onsurface: { DEFAULT: 'hsl(195 18% 12%)', variant: 'hsl(195 10% 40%)' },
        outline: { DEFAULT: 'hsl(190 10% 70%)', variant: 'hsl(190 14% 88%)' },
        success: { DEFAULT: 'hsl(160 84% 30%)', container: 'hsl(160 60% 93%)', on: 'hsl(160 90% 16%)' },
        warning: { DEFAULT: 'hsl(38 92% 42%)', container: 'hsl(45 93% 92%)', on: 'hsl(30 85% 20%)' },
        danger: { DEFAULT: 'hsl(347 77% 46%)', container: 'hsl(350 90% 95%)', on: 'hsl(347 80% 22%)' },
        info: { DEFAULT: 'hsl(217 91% 50%)', container: 'hsl(214 95% 94%)', on: 'hsl(224 76% 25%)' }
      },
      borderRadius: { xs: '4px', sm: '8px', md: '12px', lg: '16px', xl: '20px', '2xl': '28px' },
      boxShadow: {
        e1: '0 1px 2px 0 hsl(190 20% 10% / 0.06), 0 1px 3px 1px hsl(190 20% 10% / 0.05)',
        e2: '0 1px 2px 0 hsl(190 20% 10% / 0.08), 0 2px 6px 2px hsl(190 20% 10% / 0.06)',
        e3: '0 4px 8px 3px hsl(190 20% 10% / 0.08), 0 1px 3px 0 hsl(190 20% 10% / 0.10)'
      }
    }
  }
}
</script>
<style>
  html, body { -webkit-font-smoothing: antialiased; }
  .touch { min-height: 48px; }
  .focus-ring:focus-visible { outline: 2px solid hsl(175 77% 26%); outline-offset: 2px; }
</style>
</head>
<body class="h-full bg-white font-sans text-onsurface">

<main class="flex min-h-full items-center justify-center px-4 py-10">
  <div class="w-full max-w-[400px]">

    <!-- Logo -->
    <div class="mb-7 flex flex-col items-center gap-3">
      <div class="grid h-14 w-14 place-items-center rounded-lg bg-primary text-2xl font-bold text-primary-on shadow-e2">K</div>
      <span class="text-xl font-semibold tracking-tight">KaryawanKu</span>
    </div>

    <!-- Card -->
    <div class="rounded-xl border border-outline-variant bg-surface p-6 shadow-e2 sm:p-8">
      <h1 class="text-2xl font-semibold tracking-tight">Masuk</h1>
      <p class="mt-1 text-sm text-onsurface-variant">Kelola karyawan dan gaji dari satu tempat.</p>

      <form class="mt-6 space-y-4" onsubmit="event.preventDefault();">
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="nama@usaha.com"
            class="touch focus-ring w-full rounded-md border border-outline bg-surface px-4 text-[15px] outline-none placeholder:text-onsurface-variant/60" />
        </div>

        <div>
          <div class="mb-1.5 flex items-baseline justify-between">
            <label for="password" class="block text-sm font-medium">Kata Sandi</label>
            <a href="#" class="focus-ring rounded-xs text-sm font-medium text-primary hover:underline">Lupa sandi?</a>
          </div>
          <div class="relative">
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••"
              class="touch focus-ring w-full rounded-md border border-outline bg-surface pl-4 pr-14 text-[15px] outline-none placeholder:text-onsurface-variant/60" />
            <button type="button" id="togglePw" aria-label="Tampilkan kata sandi"
              class="focus-ring absolute right-1 top-1/2 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-md text-onsurface-variant hover:bg-surface-c2">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <label class="flex touch cursor-pointer items-center gap-3 text-sm">
          <input type="checkbox" class="h-5 w-5 rounded-xs border-outline text-primary accent-[hsl(175_77%_26%)]" />
          <span>Ingat saya di perangkat ini</span>
        </label>

        <button type="submit"
          class="touch focus-ring w-full rounded-full bg-primary text-[15px] font-semibold text-primary-on shadow-e1 hover:bg-primary-hover active:bg-primary-press">
          Masuk
        </button>
      </form>

      <div class="my-6 flex items-center gap-3">
        <span class="h-px flex-1 bg-outline-variant"></span>
        <span class="text-xs font-medium uppercase tracking-wide text-onsurface-variant">atau</span>
        <span class="h-px flex-1 bg-outline-variant"></span>
      </div>

      <button type="button"
        class="touch focus-ring flex w-full items-center justify-center gap-3 rounded-full border border-outline bg-surface text-[15px] font-medium hover:bg-surface-c2">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9Z"/>
          <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.6V6.7H1.4a12 12 0 0 0 0 10.8l4-3.1Z"/>
          <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.7l4 3.1C6.3 6.9 8.9 4.8 12 4.8Z"/>
        </svg>
        Masuk dengan Google
      </button>

      <p class="mt-6 text-center text-sm text-onsurface-variant">
        Belum punya akun?
        <a href="01-onboarding-wizard.html" class="focus-ring rounded-xs font-semibold text-primary hover:underline">Daftar</a>
      </p>
    </div>

    <p class="mx-auto mt-5 max-w-[340px] text-center text-xs leading-relaxed text-onsurface-variant">
      Dengan cara ini kamu setuju pada
      <a href="#" class="underline hover:text-onsurface">Syarat Layanan</a> dan
      <a href="#" class="underline hover:text-onsurface">Kebijakan Privasi</a> KaryawanKu.
    </p>
  </div>
</main>

<script>
  var pw = document.getElementById('password');
  document.getElementById('togglePw').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
  });
</script>
</body>
</html>
